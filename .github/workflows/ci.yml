name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Clear Next.js cache
        run: if (Test-Path .next) { Remove-Item -Recurse -Force .next }
      - name: Build
        run: npm run build
      - name: Test
        run: npx playwright test
